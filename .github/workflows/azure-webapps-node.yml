# =========================================================
#  mcb-hr-ops -> Azure App Service (Linux 컨테이너) 자동 배포
# ---------------------------------------------------------
#  main 에 푸시하면 이미지를 빌드해 ACR 에 올리고,
#  App Service 가 그 이미지를 바라보도록 교체한다.
#
#  ※ 게시 프로필(publish profile) 방식은 쓸 수 없다.
#     대상 앱의 SCM 기본 인증이 꺼져 있다(basicPublishingCredentialsPolicies.allow = false).
#     그래서 Azure 로그인은 OIDC 연합 자격 증명을 쓴다.
#
#  ---------------------------------------------------------
#  사전 준비 (한 번만)
#  ---------------------------------------------------------
#  A) ACR 자격 증명  — hnfriends 테넌트의 acrhnfmcb
#     az acr credential show -n acrhnfmcb \
#       --subscription afee35fb-115d-4cff-960b-f33723f67cd1
#     -> GitHub Secrets 에 등록
#        ACR_USERNAME / ACR_PASSWORD
#
#  B) Azure OIDC  — mcloudbridge 테넌트에 앱 등록 + 연합 자격 증명
#     (디렉터리 앱 등록 권한이 필요하다. 없으면 관리자에게 요청할 것)
#
#     SUB=8151e37b-7d16-4a46-8b6e-aa1cbb7e64dd
#     RG=MCB_IS_HR_Management_RG
#     APP_ID=$(az ad app create --display-name gh-mcb-hr-ops --query appId -o tsv)
#     az ad sp create --id "$APP_ID"
#     az role assignment create --assignee "$APP_ID" --role Contributor \
#       --scope "/subscriptions/$SUB/resourceGroups/$RG"
#     az ad app federated-credential create --id "$APP_ID" --parameters '{
#       "name": "github-main",
#       "issuer": "https://token.actions.githubusercontent.com",
#       "subject": "repo:boom-boom-je/mcb-hr-ops:ref:refs/heads/main",
#       "audiences": ["api://AzureADTokenExchange"]
#     }'
#
#     -> GitHub Secrets 에 등록
#        AZURE_CLIENT_ID       = $APP_ID
#        AZURE_TENANT_ID       = 033ad662-3b65-45f4-9052-5b0f8d949ff4
#        AZURE_SUBSCRIPTION_ID = 8151e37b-7d16-4a46-8b6e-aa1cbb7e64dd
#
#  수동 배포가 필요하면 scripts/azure-deploy.sh 를 쓰면 된다.
# =========================================================
name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write      # OIDC 토큰 발급용
  contents: read

env:
  REGISTRY: acrhnfmcb.azurecr.io
  IMAGE_NAME: mcb-hr-ops
  AZURE_WEBAPP_NAME: MCB-HR-Management
  AZURE_RESOURCE_GROUP: MCB_IS_HR_Management_RG
  NODE_VERSION: '20.x'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint

  build-and-deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 커밋 SHA 앞 7자리를 이미지 태그로 쓴다. 어떤 커밋이 떠 있는지
      # 앱 설정만 봐도 알 수 있게 하기 위함.
      - name: 이미지 태그 결정
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: ACR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64        # App Service Linux 는 x86-64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure 로그인 (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 레지스트리 자격 증명은 앱 설정에 이미 들어 있으므로 이미지 이름만 바꾼다.
      - name: 컨테이너 이미지 교체
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config container set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --container-image-name "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}" \
              --output none
            az webapp restart \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --output none

      # F1 플랜은 콜드 스타트가 길어서(이미지 최초 pull 포함 ~1분) 넉넉히 기다린다.
      - name: 헬스체크
        run: |
          HOST=$(az webapp show \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query defaultHostName -o tsv)
          echo "대상: https://$HOST/healthz"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$HOST/healthz" || echo 000)
            echo "  시도 $i: HTTP $code"
            if [ "$code" = "200" ]; then
              curl -s --max-time 30 "https://$HOST/healthz"
              echo
              exit 0
            fi
            sleep 15
          done
          echo "헬스체크 실패 — 컨테이너 로그를 확인할 것"
          az webapp log tail \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" &
          sleep 20
          exit 1
