<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>인재 라이프사이클 허브</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#f4f5fb;
    --surface:#ffffff;
    --surface-2:#eef0f9;
    --border:#dde1f0;
    --text:#1a1d2e;
    --text-muted:#5b607a;
    --text-faint:#8589a8;
    --accent:#4f46e5;
    --accent-soft:#eef0ff;
    --accent-2:#7c6df2;
    --success:#0f9d58;
    --success-soft:#e5f7ee;
    --warning:#b45309;
    --warning-soft:#fef3e0;
    --danger:#c0362c;
    --danger-soft:#fbeae8;
    --info:#2563eb;
    --info-soft:#e8f0fe;
    --sidebar-bg:#11142a;
    --sidebar-text:#b6bad8;
    --sidebar-text-active:#ffffff;
    --sidebar-active-bg:rgba(129,140,248,0.20);
    --sidebar-border:rgba(255,255,255,0.07);
    --shadow:0 1px 2px rgba(20,22,50,0.06), 0 8px 24px -12px rgba(20,22,50,0.18);
    --radius:12px;
    --radius-sm:8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0d1a;
      --surface:#12152a;
      --surface-2:#171b34;
      --border:#272c4c;
      --text:#e8e9f5;
      --text-muted:#9a9ec2;
      --text-faint:#6f739a;
      --accent:#8b93f8;
      --accent-soft:#1d2050;
      --accent-2:#a996f7;
      --success:#4ade80;
      --success-soft:#12301f;
      --warning:#fbbf24;
      --warning-soft:#372a0d;
      --danger:#f38b82;
      --danger-soft:#3a1a17;
      --info:#7aa8ff;
      --info-soft:#132140;
      --sidebar-bg:#080a16;
      --sidebar-border:rgba(255,255,255,0.06);
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 28px -12px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0d1a;
    --surface:#12152a;
    --surface-2:#171b34;
    --border:#272c4c;
    --text:#e8e9f5;
    --text-muted:#9a9ec2;
    --text-faint:#6f739a;
    --accent:#8b93f8;
    --accent-soft:#1d2050;
    --accent-2:#a996f7;
    --success:#4ade80;
    --success-soft:#12301f;
    --warning:#fbbf24;
    --warning-soft:#372a0d;
    --danger:#f38b82;
    --danger-soft:#3a1a17;
    --info:#7aa8ff;
    --info-soft:#132140;
    --sidebar-bg:#080a16;
    --sidebar-border:rgba(255,255,255,0.06);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 28px -12px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans KR", "Pretendard", system-ui, -apple-system, sans-serif;
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ text-wrap:balance; margin:0; font-weight:700; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; font-size:14px; }
  ::selection{ background:var(--accent-soft); }

  .app-shell{ display:flex; min-height:100vh; }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:250px; flex-shrink:0; background:var(--sidebar-bg);
    color:var(--sidebar-text); position:sticky; top:0; height:100vh;
    overflow-y:auto; display:flex; flex-direction:column;
    border-right:1px solid var(--sidebar-border);
  }
  .sidebar-brand{
    padding:22px 20px 16px; display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--sidebar-border);
  }
  .sidebar-brand .mark{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:900; font-size:15px;
  }
  .sidebar-brand .name{ color:#fff; font-weight:700; font-size:14.5px; line-height:1.3; }
  .sidebar-brand .sub{ color:var(--sidebar-text); font-size:11px; opacity:.7; }
  .nav{ padding:14px 12px; display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--sidebar-text); opacity:.55; padding:14px 10px 6px; }
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px;
    color:var(--sidebar-text); cursor:pointer; border:none; background:transparent; width:100%;
    text-align:left; font-size:13.5px; font-weight:500; transition:background .12s, color .12s;
  }
  .nav-item svg{ flex-shrink:0; width:18px; height:18px; }
  .nav-item:hover{ background:rgba(255,255,255,0.05); color:#fff; }
  .nav-item.active{ background:var(--sidebar-active-bg); color:var(--sidebar-text-active); }
  .nav-item .count{
    margin-left:auto; font-size:11px; font-weight:700; background:rgba(255,255,255,0.09);
    padding:1px 7px; border-radius:99px; color:var(--sidebar-text);
  }
  .nav-item.active .count{ background:rgba(255,255,255,0.18); color:#fff; }
  .sidebar-foot{ padding:14px 20px 18px; border-top:1px solid var(--sidebar-border); font-size:11.5px; color:var(--sidebar-text); opacity:.6; }

  /* ---------- MAIN ---------- */
  .main{ flex:1; min-width:0; padding:30px 36px 60px; max-width:1320px; }
  .topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; flex-wrap:wrap; }
  .topbar h1{ font-size:22px; letter-spacing:-.01em; }
  .topbar .desc{ color:var(--text-muted); font-size:13px; margin-top:4px; }
  .topbar-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .btn{
    display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); padding:9px 14px; border-radius:9px;
    font-size:13px; font-weight:600; cursor:pointer; transition:filter .12s, transform .04s;
    white-space:nowrap;
  }
  .btn:hover{ filter:brightness(0.97); }
  .btn:active{ transform:translateY(1px); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-danger-ghost{ color:var(--danger); }
  .btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:7px; }
  .btn-icon{ padding:8px; border-radius:8px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  .grid{ display:grid; gap:16px; }
  .kpi-grid{ grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); margin-bottom:22px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .kpi-card{ padding:18px 18px 16px; display:flex; flex-direction:column; gap:8px; }
  .kpi-card .label{ font-size:12.5px; color:var(--text-muted); font-weight:600; display:flex; align-items:center; gap:6px; }
  .kpi-card .value{ font-size:28px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .kpi-card .foot{ font-size:12px; color:var(--text-faint); }
  .kpi-icon{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .kpi-card .top-row{ display:flex; align-items:center; justify-content:space-between; }

  .section{ animation:fade .15s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(2px);} to{opacity:1; transform:none;} }

  .dash-section-h{ font-size:16px; font-weight:800; letter-spacing:-.01em; margin:24px 0 10px; }
  .dash-section-h:first-child{ margin-top:0; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:20px; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; }
  .panel-head h3{ font-size:15px; }
  .panel-body{ padding:18px; }

  .toolbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:14px 18px; border-bottom:1px solid var(--border); background:var(--surface-2); }
  .search-box{ position:relative; flex:1; min-width:180px; max-width:280px; }
  .search-box input{ width:100%; padding:8px 10px 8px 32px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); }
  .search-box svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-faint); }
  select.filter, .field input, .field select, .field textarea{
    border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:8px; padding:8px 10px;
  }
  select.filter{ padding:8px 10px; }
  .spacer{ flex:1; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); font-weight:700; padding:9px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody td{ padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr.clickable{ cursor:pointer; }
  tbody tr.clickable:hover{ background:var(--surface-2); }
  .table-scroll{ overflow-x:auto; }
  .panel-scroll-v{ max-height:340px; overflow-y:auto; }
  .num{ font-variant-numeric:tabular-nums; text-align:right; }
  .cell-strong{ font-weight:700; }
  .cell-muted{ color:var(--text-muted); }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700; white-space:nowrap; }
  .pill-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill-success{ background:var(--success-soft); color:var(--success); }
  .pill-warning{ background:var(--warning-soft); color:var(--warning); }
  .pill-danger{ background:var(--danger-soft); color:var(--danger); }
  .pill-info{ background:var(--info-soft); color:var(--info); }
  .pill-muted{ background:var(--surface-2); color:var(--text-muted); }
  .tag-sample{ font-size:10px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:1px 6px; border-radius:5px; margin-left:6px; }

  .empty-state{ padding:48px 20px; text-align:center; color:var(--text-muted); }
  .empty-state svg{ width:38px; height:38px; margin-bottom:10px; color:var(--text-faint); }
  .empty-state .t{ font-weight:700; color:var(--text); margin-bottom:4px; }

  .sample-banner{
    display:flex; align-items:center; gap:12px; background:var(--accent-soft); border:1px solid var(--accent);
    border-radius:var(--radius-sm); padding:11px 16px; margin-bottom:20px; font-size:13px; color:var(--text);
  }
  .sample-banner strong{ color:var(--accent); }
  .sample-banner .spacer{flex:1;}

  /* ---------- MODAL / DRAWER ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(10,12,26,0.45); display:flex; justify-content:flex-end; z-index:100; backdrop-filter:blur(1px); }
  .overlay.center{ justify-content:center; align-items:center; }
  .drawer{ width:min(760px, 94vw); height:100vh; background:var(--bg); box-shadow:-8px 0 32px rgba(0,0,0,0.18); display:flex; flex-direction:column; animation:slidein .18s ease; }
  @keyframes slidein{ from{ transform:translateX(24px); opacity:.6; } to{ transform:none; opacity:1; } }
  .modal{ width:min(520px, 92vw); max-height:88vh; overflow:auto; background:var(--surface); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,0.3); animation:pop .14s ease; }
  @keyframes pop{ from{ transform:scale(.97); opacity:.6; } to{ transform:none; opacity:1; } }
  .drawer-head{ padding:20px 24px; border-bottom:1px solid var(--border); background:var(--surface); display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
  .drawer-head .id-line{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .drawer-tabs{ display:flex; gap:2px; padding:0 20px; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; }
  .drawer-tab{ padding:12px 12px; font-size:12.5px; font-weight:600; color:var(--text-muted); background:none; border:none; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  .drawer-tab:hover{ color:var(--text); }
  .drawer-tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .drawer-body{ padding:22px 24px; overflow-y:auto; flex:1; }
  .modal-head{ padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .modal-body{ padding:20px 22px; }
  .modal-foot, .drawer-foot{ padding:14px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; background:var(--surface-2); }
  .close-x{ border:none; background:none; cursor:pointer; color:var(--text-muted); padding:4px; border-radius:6px; }
  .close-x:hover{ background:var(--surface-2); color:var(--text); }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-grid.single{ grid-template-columns:1fr; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.span2{ grid-column:1 / -1; }
  .field label{ font-size:12px; font-weight:700; color:var(--text-muted); }
  .field .hint{ font-size:11px; color:var(--text-faint); font-weight:400; }
  .field input, .field select, .field textarea{ width:100%; }
  .field textarea{ resize:vertical; min-height:64px; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }

  .subhead{ display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px; }
  .subhead:first-child{ margin-top:0; }
  .subhead h4{ font-size:13.5px; }
  .divider{ height:1px; background:var(--border); margin:18px 0; }

  .list-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:9px; margin-bottom:8px; background:var(--surface-2); }
  .list-row .main-txt{ flex:1; min-width:0; }
  .list-row .main-txt .t1{ font-weight:700; font-size:13px; }
  .list-row .main-txt .t2{ font-size:12px; color:var(--text-muted); }
  .icon-btn{ border:none; background:none; cursor:pointer; color:var(--text-faint); padding:5px; border-radius:6px; flex-shrink:0; }
  .icon-btn:hover{ background:var(--surface); color:var(--danger); }
  .icon-btn svg{ width:15px; height:15px; display:block; }

  .switch{ position:relative; display:inline-block; width:42px; height:24px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; cursor:pointer; inset:0; background:var(--border); border-radius:99px; transition:.15s; }
  .slider:before{ content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + .slider{ background:var(--success); }
  .switch input:checked + .slider:before{ transform:translateX(18px); }
  .switch input:focus-visible + .slider{ outline:2px solid var(--accent); outline-offset:2px; }

  .stat-mini-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .stat-mini{ background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:10px 12px; text-align:center; }
  .stat-mini .v{ font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-mini .l{ font-size:11px; color:var(--text-muted); margin-top:2px; }

  .segmented{ display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:2px; width:fit-content; }
  .segmented button{ border:none; background:none; padding:7px 13px; font-size:12.5px; font-weight:600; color:var(--text-muted); border-radius:7px; cursor:pointer; }
  .segmented button.active{ background:var(--surface); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  .bar-chart{ display:flex; flex-direction:column; gap:10px; }
  .bar-row{ display:grid; grid-template-columns:96px 1fr 44px; align-items:center; gap:10px; font-size:12.5px; }
  .bar-row .name{ color:var(--text-muted); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track{ height:10px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .bar-row .val{ font-weight:700; font-variant-numeric:tabular-nums; }
  .bar-clickable{ cursor:pointer; padding:5px 6px; margin:-5px -6px; border-radius:8px; transition:background .1s; }
  .bar-clickable:hover{ background:var(--surface-2); }
  .bar-clickable:hover .name{ color:var(--accent); }
  .kpi-clickable{ cursor:pointer; transition:transform .08s ease, box-shadow .12s ease; }
  .kpi-clickable:hover{ transform:translateY(-2px); box-shadow:0 10px 24px -10px rgba(20,22,50,0.28); }
  .kpi-link{ color:var(--accent); font-weight:700; display:inline-flex; align-items:center; gap:2px; }
  .kpi-link svg{ width:12px; height:12px; }
  .filter-chip-row{ padding:12px 18px 0; }

  .ms-filter{ position:relative; }
  .ms-filter-btn{ gap:6px; }
  .ms-filter-btn svg{ width:14px; height:14px; }
  .ms-filter-btn.active{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .ms-filter-panel{ display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:30; min-width:180px; background:var(--surface); border:1px solid var(--border); border-radius:9px; box-shadow:var(--shadow); padding:6px; }
  .ms-filter-panel.open{ display:block; }
  .ms-filter-opt{ display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:6px; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .ms-filter-opt:hover{ background:var(--surface-2); }
  .ms-filter-opt input{ flex-shrink:0; }
  .ms-filter-actions{ border-top:1px solid var(--border); margin-top:4px; padding-top:6px; text-align:right; }

  .cell-input{ width:100%; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:6px; padding:6px 8px; font-size:12.5px; }
  .cell-input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  .cell-input.num{ text-align:right; font-variant-numeric:tabular-nums; }

  .emp-layout{ display:grid; grid-template-columns:1.05fr 1.35fr; gap:16px; align-items:start; }
  @media (max-width:860px){ .emp-layout{ grid-template-columns:1fr; } }
  .emp-list-scroll{ max-height:72vh; overflow-y:auto; }
  .emp-row{ padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .1s; }
  .emp-row:last-child{ border-bottom:none; }
  .emp-row:hover{ background:var(--surface-2); }
  .emp-row.active{ background:var(--accent-soft); }
  .emp-row-chevron{ color:var(--text-faint); flex-shrink:0; width:16px; height:16px; }
  .emp-row-chevron svg{ width:16px; height:16px; display:block; }
  .emp-row.active .emp-row-chevron{ color:var(--accent); }

  .avatar{ width:34px; height:34px; border-radius:9px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; }
  .name-cell{ display:flex; align-items:center; gap:10px; }
  .name-cell .meta{ font-size:12px; color:var(--text-muted); }

  .toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; }
  .toast{ background:var(--text); color:var(--bg); padding:10px 16px; border-radius:9px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:pop .14s ease; }

  .db-banner{ background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger); padding:10px 16px; border-radius:9px; font-size:12.5px; margin-bottom:16px; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width: 860px){
    .sidebar{ display:none; }
    .main{ padding:20px; }
    .form-grid{ grid-template-columns:1fr; }
    .stat-mini-grid{ grid-template-columns:repeat(2,1fr); }
  }

  /* ---------- HR STATUS REPORT ---------- */
  .report-page{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:36px 40px; }

const EVAL_ITEMS = [

const DEFAULT_SYSTEM_PASSWORD = "0000000000";
let systemPasswords = { admin: DEFAULT_SYSTEM_PASSWORD, pmo: DEFAULT_SYSTEM_PASSWORD };
let systemSettingsReady = false;
let authState = { loggedIn:false, role:null }; // role: "admin" | "pmo"
let loginRole = "admin";
let loginError = "";
let visibleDivisions = { admin: [], pmo: [] }; // per-role: empty array = show all divisions for that role; non-empty = restrict that role's every screen to these divisions
const DEFAULT_ALERT_DAYS = { probation: 30, contract: 30 };
let alertDays = { probation: DEFAULT_ALERT_DAYS.probation, contract: DEFAULT_ALERT_DAYS.contract }; // global (not per-role): 수습 평가 알림 기준일 / 계약 갱신 알림 기준일 — days-out threshold used by probationEvalTargets()/contractRenewalDueList()

/* =========================================================
   DB LAYER  (real `db` capability, with an in-memory fallback
   so the page still works when the capability is unavailable)
   ========================================================= */
const PATH_KEY = {
  employees:"employees",
  projects:"projects",
  project_evaluations:"projectEvals",
  annual_evaluations:"annualEvals",
  regular_evaluations:"regularEvals",
  contracts:"contracts",
  subsidy_applications:"subsidyApps",
  subsidy_programs:"subsidyPrograms",
};
let realDb = null;
let dbUnavailable = false;
const local = { employees:new Map(), projects:new Map(), project_evaluations:new Map(), annual_evaluations:new Map(), regular_evaluations:new Map(), contracts:new Map(), subsidy_applications:new Map(), subsidy_programs:new Map() };
let localSeq = 1;

const rawState = { employees:[], projects:[], projectEvals:[], annualEvals:[], regularEvals:[], contracts:[], subsidyApps:[], subsidyPrograms:[] };
const state = { employees:[], projects:[], projectEvals:[], annualEvals:[], regularEvals:[], contracts:[], subsidyApps:[], subsidyPrograms:[] };

// Recomputes `state` as a division-scoped VIEW of `rawState`. When visibleDivisions
// is empty, every screen sees the full data (unrestricted). When it holds one or more
// division names, `state` is filtered down to only those divisions' employees and any
// records tied to those employees -- every existing render function keeps reading
// `state` unchanged, so this is the single choke point for the whole-app scoping.
function applyDivisionScope(){
  const roleDivs = (authState.role && visibleDivisions[authState.role]) || [];
  const restrict = roleDivs.length > 0;
  const visIds = restrict ? new Set((rawState.employees||[]).filter(e=> roleDivs.includes(e.division||"미지정")).map(e=>e.id)) : null;
  state.employees = restrict ? (rawState.employees||[]).filter(e=> visIds.has(e.id)) : (rawState.employees||[]);
  ["projectEvals","annualEvals","regularEvals","contracts","subsidyApps"].forEach(key=>{
    state[key] = restrict ? (rawState[key]||[]).filter(d=> visIds.has(d.employeeId)) : (rawState[key]||[]);
  });
  state.projects = rawState.projects || [];
  state.subsidyPrograms = rawState.subsidyPrograms || [];
}

function refreshLocal(path){
  const key = PATH_KEY[path];
  rawState[key] = [...local[path].entries()].map(([id,data])=>({id, ...data})).sort((a,b)=> (a._ord||0)-(b._ord||0));
  applyDivisionScope();
}

async function dbAdd(path, data){
  const body = {...data, createdAt:new Date().toISOString()};
  if(realDb){ const ref = await realDb.collection(path).add(body); return ref.id; }
  const id = "local-"+(localSeq++);
  local[path].set(id, {...body, _ord:localSeq});
  refreshLocal(path); renderRoute();
  return id;
}
async function dbSet(path, id, data){
  if(realDb){ await realDb.doc(path+"/"+id).set(data); return; }
  local[path].set(id, {...data});
  refreshLocal(path); renderRoute();
}
async function dbUpdate(path, id, data){
  if(realDb){ await realDb.doc(path+"/"+id).update(data); return; }
  const cur = local[path].get(id) || {};
  local[path].set(id, deepMerge(cur, data));
  refreshLocal(path); renderRoute();
}
async function dbDelete(path, id){
  if(realDb){ await realDb.doc(path+"/"+id).delete(); return; }
  local[path].delete(id);
  refreshLocal(path); renderRoute();
}
function deepMerge(base, patch){
  const out = {...base};
  for(const k in patch){
    if(patch[k] && typeof patch[k]==="object" && !Array.isArray(patch[k]) && base[k] && typeof base[k]==="object"){
      out[k] = deepMerge(base[k], patch[k]);
    } else out[k] = patch[k];
  }
  return out;
}
function subscribeAll(){
  Object.keys(PATH_KEY).forEach(path=>{
    const key = PATH_KEY[path];
    if(realDb){
      realDb.collection(path).onSnapshot(
        snap=>{ rawState[key] = snap.docs.map(d=>({id:d.id, ...d.data()})); applyDivisionScope(); renderRoute(); updateSidebarCounts(); },
        err=>{ dbUnavailable = true; renderDbBanner(err); }
      );
    } else {
      refreshLocal(path);
    }
  });
}
async function clearSampleData(){
  if(!confirmState.resolve) return;
  for(const path of Object.keys(PATH_KEY)){
    const key = PATH_KEY[path];
    const samples = (rawState[key]||[]).filter(d=>d.isSample);
    for(const s of samples){ await dbDelete(path, s.id); }
  }
  toast("샘플 데이터를 정리했습니다.");
}

/* =========================================================
   SYSTEM SETTINGS (login password)
   ========================================================= */
function subscribeSystemSettings(){
  if(realDb){
    try{
      realDb.doc("app_settings/system").onSnapshot(
        snap=>{
          const d = snap && snap.exists ? snap.data() : null;
          if(d){
            const legacy = d.password; // backward-compat: single shared password from before admin/pmo were split
            systemPasswords.admin = d.adminPassword || legacy || DEFAULT_SYSTEM_PASSWORD;
            systemPasswords.pmo = d.pmoPassword || legacy || DEFAULT_SYSTEM_PASSWORD;
            if(Array.isArray(d.visibleDivisions)){
              // backward-compat: earlier version stored one shared array for both roles
              visibleDivisions = { admin: d.visibleDivisions, pmo: d.visibleDivisions };
            } else if(d.visibleDivisions && typeof d.visibleDivisions==="object"){
              visibleDivisions = {
                admin: Array.isArray(d.visibleDivisions.admin) ? d.visibleDivisions.admin : [],
                pmo: Array.isArray(d.visibleDivisions.pmo) ? d.visibleDivisions.pmo : [],
              };
            } else {
              visibleDivisions = { admin: [], pmo: [] };
            }
            if(d.alertDays && typeof d.alertDays==="object"){
              alertDays = {
                probation: Number(d.alertDays.probation)>0 ? Number(d.alertDays.probation) : DEFAULT_ALERT_DAYS.probation,
                contract: Number(d.alertDays.contract)>0 ? Number(d.alertDays.contract) : DEFAULT_ALERT_DAYS.contract,
              };
            } else {
              alertDays = { probation: DEFAULT_ALERT_DAYS.probation, contract: DEFAULT_ALERT_DAYS.contract };
            }
          }
          systemSettingsReady = true;
          applyDivisionScope();
          renderAuthGate();
          renderRoute();
        },
        err=>{ systemSettingsReady = true; renderAuthGate(); }
      );
    }catch(err){ systemSettingsReady = true; renderAuthGate(); }
  } else {
    systemSettingsReady = true;
    renderAuthGate();
  }
}
async function writeAppSettingsDoc(){
  if(!realDb) return true;
  try{
    await realDb.doc("app_settings/system").set({
      adminPassword: systemPasswords.admin,
      pmoPassword: systemPasswords.pmo,
      visibleDivisions: visibleDivisions,
      alertDays: alertDays,
    });
    return true;
  }catch(err){
    toast("설정 저장에 실패했습니다. 이 화면(탭)에서는 적용되었지만 다른 사용자에게는 반영되지 않았을 수 있습니다.");
    return false;
  }
}
async function setSystemPassword(role, newPw){
  systemPasswords[role] = newPw;
  const ok = await writeAppSettingsDoc();
  if(!ok) return;
  toast((role==="admin"?"관리자":"PMO")+" 암호가 변경되었습니다.");
}
async function setVisibleDivisions(role, divs){
  visibleDivisions[role] = divs.slice();
  applyDivisionScope();

/* =========================================================
   UTILITIES
   ========================================================= */
const TODAY = new Date().toISOString().slice(0,10);
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function fmtDate(d){ if(!d) return "—"; return String(d).replaceAll("-", "."); }
function fmtWon(m){ if(m===undefined||m===null||m==="") return "—"; return Number(m).toLocaleString("ko-KR")+"만원"; }
function addMonths(dateStr, n){
  const d = new Date(dateStr+"T00:00:00");
  if(isNaN(d)) return "";
  d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}
function monthsBetween(start, end){
  if(!start || !end) return [];
  let d = new Date(start+"T00:00:00");
  const endD = new Date(end+"T00:00:00");
  if(isNaN(d) || isNaN(endD) || d>endD) return [];
  d.setDate(1); endD.setDate(1);
  const out = [];
  let guard = 0;
  while(d<=endD && guard<240){
    out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));
    d.setMonth(d.getMonth()+1);
    guard++;
  }
  return out;
}
function fmtYm(ym){ if(!ym) return "—"; const [y,m]=ym.split("-"); return `${y}년 ${Number(m)}월`; }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const a = new Date(todayISO()+"T00:00:00"), b = new Date(dateStr+"T00:00:00");
  if(isNaN(b)) return null;
  return Math.round((b-a)/86400000);
}
function initials(name){ return (name||"?").trim().slice(0,1); }
function ddayLabel(dateStr){
  const d = daysUntil(dateStr);
  if(d===null) return "—";
  if(d===0) return "D-day";
  return d>0 ? `D-${d}` : `D+${-d}`;
}
function ageFromBirth(birthDate){
  if(!birthDate) return null;
  const b = new Date(birthDate+"T00:00:00"), t = new Date(todayISO()+"T00:00:00");
  if(isNaN(b)) return null;
  let age = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if(m<0 || (m===0 && t.getDate()<b.getDate())) age--;
  return age;
}
function yearsMonthsLabel(fromDate, toDate){
  if(!fromDate) return "—";
  const a = new Date(fromDate+"T00:00:00");
  const b = toDate ? new Date(toDate+"T00:00:00") : new Date(todayISO()+"T00:00:00");
  if(isNaN(a) || isNaN(b) || b<a) return "—";
  let years = b.getFullYear() - a.getFullYear();
  let months = b.getMonth() - a.getMonth();
  if(b.getDate() < a.getDate()) months--;
  if(months<0){ years--; months+=12; }
  if(years<=0 && months<=0) return "1개월 미만";
  return (years>0 ? `${years}년 ` : "") + `${months}개월`;
}
function monthsRemaining(endDate){
  if(!endDate) return null;
  const t = new Date(todayISO()+"T00:00:00"), e = new Date(endDate+"T00:00:00");
  if(isNaN(e)) return null;
  let months = (e.getFullYear()-t.getFullYear())*12 + (e.getMonth()-t.getMonth());
  if(e.getDate() < t.getDate()) months--;
  return months;
}
function monthsSinceNum(dateStr){
  if(!dateStr) return null;
  const a = new Date(dateStr+"T00:00:00"), b = new Date(todayISO()+"T00:00:00");
  if(isNaN(a)) return null;
  let months = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if(b.getDate() < a.getDate()) months--;
  return Math.max(0, months);
}
function ymLabelFromMonths(totalMonths){
  if(totalMonths===null || totalMonths===undefined || isNaN(totalMonths)) return "—";
  const years = Math.floor(totalMonths/12), months = Math.round(totalMonths%12);
  if(years<=0 && months<=0) return "1개월 미만";
  return (years>0?`${years}년 `:"")+`${months}개월`;
}
function byId(id){ return document.getElementById(id); }
function uid(prefix){ return prefix+"_"+Math.random().toString(36).slice(2,9); }

function empById(id){ return state.employees.find(e=>e.id===id); }
function empLabel(e){ return e ? `${e.name} · ${e.division||"사업부 미정"}` : "—"; }
function contractedEmployees(){ return state.employees.filter(e=> e.status!=="퇴사" && state.contracts.some(c=>c.employeeId===e.id)); }
function contractRenewalDueList(){
  // Renewal basis is the employee master's "최종 계약일" (lastContractDate) field, not the
  // matched contract document's own startDate -- the two are usually kept in sync when a
  // renewal is processed, but lastContractDate is the authoritative source for this calc.
  const latestByEmp = contractedEmployees().map(e=>{
    const cs = state.contracts.filter(c=>c.employeeId===e.id);
    const latest = [...cs].sort((a,b)=>(b.startDate||"").localeCompare(a.startDate||""))[0];
    return {e, c:latest};
  });
  return latestByEmp
    .filter(({e})=> e.lastContractDate)
    .map(({e,c})=>{
      const anniv = addMonths(e.lastContractDate, 12);
      return {e, c, anniv, d:daysUntil(anniv)};
    })
    .filter(({d})=> d!==null && d<=alertDays.contract)
    .sort((a,b)=> a.d-b.d);
}
// Recomputes the employee master's "지원금 대상자" status from that employee's subsidy
// applications, and writes it back if it changed. overrideAppId/overrideStatus reflect an
// in-flight change before the db snapshot refreshes (overrideStatus===null means that
// application was just deleted). When an employee has multiple applications, the
// most-advanced status wins: 완료 > 진행중 > 대기.
function bestSubsidyEmpStatus(apps){
  let best = null;
  apps.forEach(a=>{
    const mapped = SUBSIDY_APP_STATUS_TO_EMP_FIELD[a.status||"대기"] || "대기";
    if(!best || SUBSIDY_EMP_STATUS_RANK[mapped] > SUBSIDY_EMP_STATUS_RANK[best]) best = mapped;
  });
  return best;
}
async function syncEmployeeSubsidyStatus(employeeId, overrideAppId, overrideStatus){
  let apps = (rawState.subsidyApps||[]).filter(a=>a.employeeId===employeeId);
  if(overrideAppId){
    if(overrideStatus===null){
      apps = apps.filter(a=>a.id!==overrideAppId);
    } else if(overrideStatus!==undefined){
      const exists = apps.some(a=>a.id===overrideAppId);
      apps = exists ? apps.map(a=> a.id===overrideAppId ? {...a, status:overrideStatus} : a) : [...apps, {id:overrideAppId, status:overrideStatus}];
    }
  }
  if(!apps.length) return;
  const best = bestSubsidyEmpStatus(apps);
  const emp = rawState.employees.find(e=>e.id===employeeId);
  if(emp && best && emp.subsidyEligible !== best){
    await dbUpdate("employees", employeeId, {subsidyEligible: best});
  }
}

          return `<tr class="clickable" data-open-emp="${e.id}"><td><div class="name-cell"><div class="avatar">${esc(initials(e.name))}</div><div><div class="cell-strong">${esc(e.name)}</div><div class="meta">${esc(e.division||"—")}</div></div></div></td><td>${pill(st.label, st.tone)}</td><td class="cell-muted">${hasEnd?`종료일 ${fmtDate(e.probation.endDate)} (${ddayLabel(e.probation.endDate)})`:"종료일 미등록"}</td></tr>`;

function navLabelOf(routeKey){
  for(const g of NAV_GROUPS){ const it = g.items.find(i=>i.key===routeKey); if(it) return it.label; }
  return "화면";
}
function kpiCard(icon, label, value, foot, tone, quick, routeTo){
  const attrs = routeTo ? ` data-route-to="${esc(routeTo)}" tabindex="0" role="button" aria-label="${esc(label)} 화면으로 이동"`
    : quick ? ` data-quickfilter="${esc(JSON.stringify(quick))}" tabindex="0" role="button" aria-label="${esc(label)} 인력 목록 보기"` : "";
  const clickable = !!(quick||routeTo);
  return `<div class="card kpi-card ${clickable?"kpi-clickable":""}"${attrs}>
    <div class="top-row"><div class="label">${esc(label)}</div><div class="kpi-icon" style="background:var(--${tone}-soft); color:var(--${tone})">${ICON[icon]}</div></div>
    <div class="value">${esc(value)}</div>
    <div class="foot">${esc(foot)}${clickable?`<br><span class="kpi-link">${routeTo?`${esc(navLabelOf(routeTo))}에서 보기`:"인력 마스터에서 보기"} ${ICON.chevron}</span>`:""}</div>
  </div>`;
}
function emptyState(icon, text){
  return `<div class="empty-state">${ICON[icon]}<div class="t">${esc(text)}</div></div>`;
}
function renderStatNumberList(rows, emptyIcon, emptyText){
  if(!rows.length) return emptyState(emptyIcon, emptyText);
  return `<div class="table-scroll"><table>
    <thead><tr><th>구분</th><th class="num">인원</th></tr></thead>
    <tbody>${rows.map(r=>`
      <tr class="clickable" data-quickfilter="${esc(JSON.stringify(r.quick))}" tabindex="0" role="button" aria-label="${esc(r.label)} 인력 목록 보기"><td class="cell-strong">${esc(r.label)}</td><td class="num cell-strong">${r.value}명</td></tr>
    `).join("")}</tbody>
  </table></div>`;
}

async function buildReportPdfBlob(){
  if(typeof html2canvas==="undefined" || !(window.jspdf && window.jspdf.jsPDF)) return null;
  const d = hrReportData();
  const host = document.createElement("div");
  host.style.cssText = "position:fixed; left:-10000px; top:0; width:794px; background:#ffffff; z-index:-1;";
  host.setAttribute("data-theme","light");
  host.style.setProperty("--surface","#ffffff");
  host.style.setProperty("--surface-2","#eef0f9");
  host.style.setProperty("--border","#dde1f0");
  host.style.setProperty("--text","#1a1d2e");
  host.style.setProperty("--text-muted","#5b607a");
  host.style.setProperty("--text-faint","#8589a8");
  host.style.setProperty("--radius","12px");
  host.innerHTML = buildReportPageHtml(d);
  document.body.appendChild(host);
  try{
    const canvas = await html2canvas(host, {scale:2, backgroundColor:"#ffffff", useCORS:true});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:"pt", format:"a4"});
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = canvas.height * (imgW / canvas.width);
    const imgData = canvas.toDataURL("image/png");
    let heightLeft = imgH;
    let position = 0;
    pdf.addImage(imgData, "PNG", 0, position, imgW, imgH);
    heightLeft -= pageH;
    while(heightLeft > 0){
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, "PNG", 0, position, imgW, imgH);
      heightLeft -= pageH;
    }
    return pdf.output("blob");
  }catch(err){
    return null;
  }finally{
    document.body.removeChild(host);
  }
}
async function downloadReportPdf(btn){
  const cap = await getDownloadsCap();
  if(!cap){ toast("이 화면에서는 파일 다운로드를 사용할 수 없습니다."); return; }
  const origLabel = btn.textContent;
  btn.disabled = true; btn.textContent = "PDF 생성 중…";
  try{
    const blob = await buildReportPdfBlob();
    if(!blob){ toast("PDF 생성에 실패했습니다. 잠시 후 다시 시도해 주세요."); return; }
    await cap.save({filename:`인력_현황_보고서_${todayISO().replaceAll("-","")}.pdf`, data:blob});
    toast("PDF 파일을 저장했습니다. 열려 있는 메일 프로그램에 직접 첨부해 주세요.");
  }catch(err){
    if(err && err.code==="declined") return;
    toast("PDF 저장에 실패했습니다.");
  }finally{
    btn.disabled = false; btn.textContent = origLabel;
  }
}

let empFilters = { q:"", divisions:[], statuses:[], locations:[], recruitTypes:[], employmentTypes:[], quick:null };
let openFilterDropdown = null; // "division" | "status" | "location" | "recruitType" | "employmentType" | null
function msArrayFor(kind){
  switch(kind){
    case "division": return empFilters.divisions;
    case "status": return empFilters.statuses;
    case "location": return empFilters.locations;
    case "recruitType": return empFilters.recruitTypes;
    case "employmentType": return empFilters.employmentTypes;
    default: return null;
  }
}
function employeeMatchesQuick(e, quick){
  if(!quick) return true;
  switch(quick.type){
    case "divisionActive": return e.division===quick.value && e.status!=="퇴사";
    case "subsidy": return !!e.subsidyEligible && e.subsidyEligible!=="아니오";
    case "contractExpiring": {
      const cs = state.contracts.filter(c=>c.employeeId===e.id);
      return cs.some(c=>{ const eff=contractEffectiveStatus(c); return eff.label.startsWith("만료 임박"); });
    }
    case "grade": {
      const evs = state.annualEvals.filter(ae=>ae.employeeId===e.id);
      return evs.some(ae=>ae.grade===quick.value);
    }
    case "leaveType": return isOnLeave(e);
    case "employmentType": return e.status!=="퇴사" && e.employmentType===quick.value;
    case "employmentTypeExternal": return e.status!=="퇴사" && (e.employmentType==="계약직" || e.employmentType==="외주업체");
    case "recruitType": return e.status!=="퇴사" && (e.recruitType||"정직원")===quick.value;
    case "location": return e.status!=="퇴사" && (e.location||"한국")===quick.value;
    case "probationDue": {
      if(e.status!=="수습" || !e.probation || !e.probation.endDate) return false;
      const d = daysUntil(e.probation.endDate);
      return d!==null && d>=0 && d<=30;
    }
    default: return true;
  }
}
function quickFilterLabel(quick){
  if(!quick) return "";
  const map = {
    subsidy: ()=>"정부지원금 대상",
    contractExpiring: ()=>"계약 만료(30)",
    grade: v=>`연간평가 등급: ${v}`,
    leaveType: ()=>"출산·육아 휴가",
    employmentType: v=>`고용형태: ${v}`,
    employmentTypeExternal: ()=>"계약직 · 외주업체",
    probationDue: ()=>"수습평가 임박(30일)",
    recruitType: v=>`채용 타입: ${v}`,
    location: v=>`소속 위치: ${v}`,
  };
  const fn = map[quick.type];
  return fn ? fn(quick.value) : "필터 적용됨";
}

function msLabel(prefix, arr, options){
  if(!arr.length) return `${prefix} 전체`;
  if(arr.length===options.length) return `${prefix} 전체`;
  if(arr.length<=2) return `${prefix}: ${arr.join(", ")}`;
  return `${prefix} (${arr.length})`;
}

function filteredEmployeesForMaster(){
  return state.employees.filter(e=>{
    if(empFilters.statuses.length && !empFilters.statuses.includes(e.status)) return false;
    if(empFilters.divisions.length && !empFilters.divisions.includes(e.division)) return false;
    if(empFilters.locations.length && !empFilters.locations.includes(e.location||"한국")) return false;
    if(empFilters.recruitTypes.length && !empFilters.recruitTypes.includes(e.recruitType||"정직원")) return false;
    if(empFilters.employmentTypes.length && !empFilters.employmentTypes.includes(e.employmentType)) return false;
    if(empFilters.quick && !employeeMatchesQuick(e, empFilters.quick)) return false;
    if(empFilters.q){
      const q = empFilters.q.toLowerCase();
      if(!(`${e.name} ${e.empNo||""} ${e.division||""}`.toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

function parseDateCell(val){
  if(val===undefined || val===null || val==="") return "";
  if(typeof val==="number" && window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code){
    const d = XLSX.SSF.parse_date_code(val);
    if(d) return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
  }
  const s = String(val).trim();
  const ymd = s.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(ymd) return `${ymd[1]}-${String(ymd[2]).padStart(2,"0")}-${String(ymd[3]).padStart(2,"0")}`;
  // M/D/YY or M/D/YYYY (month-first, year last) -- e.g. a date cell stored as plain text in Excel
  // comes through as "6/30/26" rather than a native date serial, which the pattern above doesn't match.
  const mdy = s.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2}|\d{4})$/);
  if(mdy){
    const mo = Number(mdy[1]), da = Number(mdy[2]);
    let yr = Number(mdy[3]);
    if(mdy[3].length===2) yr += (yr<=68 ? 2000 : 1900);
    if(mo>=1 && mo<=12 && da>=1 && da<=31) return `${yr}-${String(mo).padStart(2,"0")}-${String(da).padStart(2,"0")}`;
  }
  return s;
}
function matchOption(val, options, def){
  const s = String(val==null?"":val).trim();
  if(!s) return def!==undefined ? def : "";
  const hit = options.find(o=> o===s || o.toLowerCase()===s.toLowerCase());
  return hit || (def!==undefined ? def : s);
}
function mapImportRow(row, cols){
  const out = {}; const missing = [];
  cols.forEach(c=>{
    const raw = row[c.header];
    let v;
    if(c.type==="date") v = parseDateCell(raw);
    else if(c.type==="number") v = raw===""||raw==null ? 0 : (Number(String(raw).replace(/,/g,""))||0);
    else if(c.type==="select") v = matchOption(raw, c.options, c.def);
    else v = raw==null ? "" : String(raw).trim();
    if(c.required && !v) missing.push(c.header);
    out[c.field] = v;
  });
  return {data:out, missing};
}

function colLetter(n){
  let s = "";
  while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); }
  return s;
}
function fillSheetWithValidation(sheet, cols, sampleRows, validationLastRow){
  sheet.addRow(cols.map(c=>c.header));
  sheet.getRow(1).font = {bold:true};
  sampleRows.forEach(r=> sheet.addRow(r));
  cols.forEach((c,idx)=>{
    const colNum = idx+1;
    sheet.getColumn(colNum).width = Math.max(12, c.header.length*1.8);
    if(c.type==="select" && Array.isArray(c.options) && c.options.length){
      const letter = colLetter(colNum);
      for(let row=2; row<=validationLastRow; row++){
        sheet.getCell(`${letter}${row}`).dataValidation = {
          type: "list",
          allowBlank: true,
          formulae: [`"${c.options.join(",")}"`],
          showErrorMessage: true,
          errorStyle: "warning",
          error: "목록에 있는 값 중 하나를 선택해 주세요.",
        };
      }
    }
  });
}

async function exportRowsToExcel(filename, sheetName, cols, rows){
  if(typeof XLSX==="undefined"){ toast("엑셀 라이브러리를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요."); return; }
  if(!rows.length){ toast("다운로드할 데이터가 없습니다."); return; }
  const aoa = [cols.map(c=>c.header), ...rows.map(r=> cols.map(c=> r[c.field]==null ? "" : r[c.field]))];
  const wb = XLSX.utils.book_new();
  const sheet = XLSX.utils.aoa_to_sheet(aoa);
  cols.forEach((c,idx)=>{ if(!sheet["!cols"]) sheet["!cols"]=[]; sheet["!cols"][idx] = {wch: Math.max(12, c.header.length*1.8)}; });
  XLSX.utils.book_append_sheet(wb, sheet, sheetName);
  const arrbuf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
  const blob = new Blob([arrbuf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const cap = await getDownloadsCap();
  if(!cap){ toast("이 화면에서는 파일 다운로드를 사용할 수 없습니다."); return; }
  try{
    await cap.save({filename, data:blob});
    toast("엑셀 파일이 저장되었습니다.");
  }catch(err){
    if(err && err.code==="declined") return;
    toast("파일 저장에 실패했습니다.");
  }
}

async function handleImportFile(file){
  if(typeof XLSX==="undefined"){ toast("엑셀 라이브러리를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요."); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const empSheetName = wb.SheetNames.find(n=>n.trim()==="직원") || wb.SheetNames[0];
    const contractSheetName = wb.SheetNames.find(n=>n.trim()==="계약");
    const sheetOpts = {defval:"", raw:false, dateNF:"yyyy-mm-dd"};
    const empRowsRaw = empSheetName ? XLSX.utils.sheet_to_json(wb.Sheets[empSheetName], sheetOpts) : [];
    const contractRowsRaw = contractSheetName ? XLSX.utils.sheet_to_json(wb.Sheets[contractSheetName], sheetOpts) : [];

    const employees = []; const empErrors = [];
    empRowsRaw.forEach((row,i)=>{
      const {data, missing} = mapImportRow(row, EMP_IMPORT_COLS);
      if(missing.length){ empErrors.push(`직원 시트 ${i+2}행: ${missing.join(", ")} 누락으로 건너뜀`); return; }
      employees.push(data);
    });

    const existingNames = new Set(state.employees.map(e=>e.name));
    const importNames = new Set(employees.map(e=>e.name));
    const contracts = []; const contractErrors = [];
    contractRowsRaw.forEach((row,i)=>{
      const {data, missing} = mapImportRow(row, CONTRACT_IMPORT_COLS);
      if(missing.length){ contractErrors.push(`계약 시트 ${i+2}행: ${missing.join(", ")} 누락으로 건너뜀`); return; }
      if(!existingNames.has(data.employeeName) && !importNames.has(data.employeeName)){
        contractErrors.push(`계약 시트 ${i+2}행: '${data.employeeName}' 직원을 찾을 수 없어 건너뜀`);
        return;
      }
      contracts.push(data);
    });

    importParsed = {employees, contracts, empErrors, contractErrors};
    renderImportPreview();
  }catch(err){
    toast("엑셀 파일을 읽는 중 오류가 발생했습니다. 형식을 확인해 주세요.");
  }
}
async function runImport(){
  if(!importParsed) return;
  const {employees, contracts} = importParsed;
  const nameToId = new Map(state.employees.map(e=>[e.name, e.id]));
  for(const data of employees){
    const payload = {...data, resume:{education:[], careerHistory:[], certifications:[], skills:[]}, currentTasks:[], probation:{}};
    const id = await dbAdd("employees", payload);
    nameToId.set(data.name, id);
  }
  let contractOk = 0;
  for(const data of contracts){
    const employeeId = nameToId.get(data.employeeName);
    if(!employeeId) continue;
    const {employeeName, empNo, ...rest} = data;
    await dbAdd("contracts", {employeeId, employeeName, ...rest});
    contractOk++;
  }
  closeOverlay();
  toast(`직원 ${employees.length}건, 계약 ${contractOk}건이 업로드되었습니다.`);
  importParsed = null;
  setRoute("employees");
}

const SUBSIDY_PROGRAM_IMPORT_COLS = [
  {header:"항목명(프로그램명)", field:"name", type:"text", required:true},
  {header:"기본 지원 금액(만원)", field:"amount", type:"number"},

];
async function exportSubsidyProgramsExcel(){

  await exportRowsToExcel(`지원금_마스터_${todayISO().replaceAll("-","")}.xlsx`, "지원금항목", SUBSIDY_PROGRAM_IMPORT_COLS, rows);
}
const SAMPLE_SUBSIDY_PROGRAM_ROWS = [
  ["청년내일채움공제", 1200, 24, "청년 정규직 채용 지원금"],
  ["고용안정장려금", 720, 12, "월 60만원 x 12개월 지원"],
];
function buildSubsidyProgramSampleWorkbookPlain(){
  const aoa = [SUBSIDY_PROGRAM_IMPORT_COLS.map(c=>c.header), ...SAMPLE_SUBSIDY_PROGRAM_ROWS];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "지원금항목");
  return wb;
}
async function buildSubsidyProgramSampleWorkbookXlsx(){
  const wb = new ExcelJS.Workbook();
  const sheet = wb.addWorksheet("지원금항목");
  fillSheetWithValidation(sheet, SUBSIDY_PROGRAM_IMPORT_COLS, SAMPLE_SUBSIDY_PROGRAM_ROWS, 200);
  return wb;
}
async function downloadSubsidyProgramSampleExcel(){
  let blob;
  if(typeof ExcelJS!=="undefined"){
    try{
      const wb = await buildSubsidyProgramSampleWorkbookXlsx();
      const arrbuf = await wb.xlsx.writeBuffer();
      blob = new Blob([arrbuf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    }catch(err){
      blob = null;
    }
  }
  if(!blob){
    if(typeof XLSX==="undefined"){ toast("엑셀 라이브러리를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요."); return; }
    const wb = buildSubsidyProgramSampleWorkbookPlain();
    const arrbuf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    blob = new Blob([arrbuf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    toast("샘플 엑셀 파일을 생성합니다.");
  }
  const cap = await getDownloadsCap();
  if(!cap){ toast("이 화면에서는 파일 다운로드를 사용할 수 없습니다."); return; }
  try{
    await cap.save({filename:"지원금_마스터_업로드_샘플.xlsx", data:blob});
    toast("샘플 엑셀 파일이 저장되었습니다.");
  }catch(err){
    if(err && err.code==="declined") return;
    toast("샘플 파일 저장에 실패했습니다.");
  }
}
let importSubsidyProgramParsed = null; // {items:[...], errors:[...]}
function renderSubsidyProgramImportPreview(){
  const box = byId("importSubsidyProgramPreviewBox");
  if(!box) return;
  if(!importSubsidyProgramParsed){ box.innerHTML = ""; return; }
  const {items, errors} = importSubsidyProgramParsed;
  const errLines = errors.slice(0,10);
  box.innerHTML = `
    <div class="stat-mini-grid" style="grid-template-columns:1fr; margin-top:14px;">
      <div class="stat-mini"><div class="v">${items.length}</div><div class="l">지원금 항목 · 업로드 가능</div></div>
    </div>
    ${errLines.length ? `<div class="field hint" style="margin-top:10px; color:var(--danger);">${errLines.map(e=>esc(e)).join("<br>")}${errors.length>10?`<br>외 ${errors.length-10}건`:""}</div>` : ""}
  `;
  const uploadBtn = byId("confirmImportSubsidyProgramBtn");
  if(uploadBtn) uploadBtn.disabled = items.length===0;
}
async function handleImportSubsidyProgramFile(file){
  if(typeof XLSX==="undefined"){ toast("엑셀 라이브러리를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요."); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const sheetName = wb.SheetNames.find(n=>n.trim()==="지원금항목") || wb.SheetNames[0];
    const sheetOpts = {defval:"", raw:false};
    const rowsRaw = sheetName ? XLSX.utils.sheet_to_json(wb.Sheets[sheetName], sheetOpts) : [];
    const items = []; const errors = [];
    rowsRaw.forEach((row,i)=>{
      const {data, missing} = mapImportRow(row, SUBSIDY_PROGRAM_IMPORT_COLS);
      if(missing.length){ errors.push(`${i+2}행: ${missing.join(", ")} 누락으로 건너뜀`); return; }
      items.push(data);
    });
    importSubsidyProgramParsed = {items, errors};
    renderSubsidyProgramImportPreview();
  }catch(err){
    toast("엑셀 파일을 읽는 중 오류가 발생했습니다. 형식을 확인해 주세요.");
  }
}
async function runSubsidyProgramImport(){
  if(!importSubsidyProgramParsed) return;
  const {items} = importSubsidyProgramParsed;
  for(const data of items){ await dbAdd("subsidy_programs", data); }
  closeOverlay();
  toast(`지원금 항목 ${items.length}건이 업로드되었습니다.`);
  importSubsidyProgramParsed = null;
  setRoute("subsidyPrograms");
}
function openSubsidyProgramImportModal(){
  importSubsidyProgramParsed = null;
  openModal("엑셀로 지원금 마스터 업로드", `
    <div class="field hint" style="margin-bottom:12px;">'지원금항목' 시트로 구성된 엑셀 파일을 업로드해 주세요. 먼저 샘플 파일을 내려받아 형식을 확인하시는 것을 권장합니다.</div>
    <button class="btn btn-sm" id="downloadSubsidyProgramSampleBtn" type="button">${ICON.download}샘플 엑셀 다운로드</button>
    <div class="divider"></div>
    <div class="field"><label>엑셀 파일 선택 (.xlsx)</label><input type="file" id="importSubsidyProgramFileInput" accept=".xlsx"></div>
    <div id="importSubsidyProgramPreviewBox"></div>
  `, `<button class="btn" data-cancel>취소</button><button class="btn btn-primary" id="confirmImportSubsidyProgramBtn" disabled>업로드</button>`);
  byId("overlayRoot").querySelector("[data-cancel]").onclick = closeOverlay;
  byId("downloadSubsidyProgramSampleBtn").onclick = downloadSubsidyProgramSampleExcel;
  byId("importSubsidyProgramFileInput").onchange = (ev)=>{
    const file = ev.target.files && ev.target.files[0];
    if(file) handleImportSubsidyProgramFile(file);
  };
  byId("confirmImportSubsidyProgramBtn").onclick = runSubsidyProgramImport;
}

/* ---- drawer event binding ---- */
function bindDrawerEvents(e){
  const root = byId("drawerBody");

  // profile
  const editBtn = root.querySelector("[data-edit-profile]");
  if(editBtn) editBtn.onclick = ()=> openEditProfileModal(e);
  const addTaskBtn = root.querySelector("[data-add-task]");
  if(addTaskBtn) addTaskBtn.onclick = ()=> openAddTaskModal(e);
  root.querySelectorAll("[data-del-task]").forEach(b=> b.onclick = async ()=>{
    const idx = Number(b.dataset.delTask); const tasks=[...(e.currentTasks||[])]; tasks.splice(idx,1);
    await dbUpdate("employees", e.id, {currentTasks:tasks}); refreshDrawerAfterMutate(e.id);
  });
  root.querySelectorAll(".task-status-sel").forEach(sel=> sel.onchange = async ()=>{
    const idx = Number(sel.dataset.taskIdx); const tasks=[...(e.currentTasks||[])]; tasks[idx]={...tasks[idx], status:sel.value, updatedDate:todayISO()};
    await dbUpdate("employees", e.id, {currentTasks:tasks}); refreshDrawerAfterMutate(e.id);
  });

  // resume
  bindClick(root,"[data-add-edu]", ()=>openResumeItemModal(e,"education"));
  bindClick(root,"[data-add-career]", ()=>openResumeItemModal(e,"careerHistory"));
  bindClick(root,"[data-add-cert]", ()=>openSimpleTextModal(e,"certifications","자격증 추가","자격증명"));
  bindClick(root,"[data-add-skill]", ()=>openSimpleTextModal(e,"skills","스킬 추가","스킬명"));
  root.querySelectorAll("[data-del-edu]").forEach(b=> b.onclick=()=>removeResumeItem(e,"education",Number(b.dataset.delEdu)));
  root.querySelectorAll("[data-del-career]").forEach(b=> b.onclick=()=>removeResumeItem(e,"careerHistory",Number(b.dataset.delCareer)));
  root.querySelectorAll("[data-del-cert]").forEach(b=> b.onclick=()=>removeResumeItem(e,"certifications",Number(b.dataset.delCert)));
  root.querySelectorAll("[data-del-skill]").forEach(b=> b.onclick=()=>removeResumeItem(e,"skills",Number(b.dataset.delSkill)));

  // project eval
  bindClick(root,"[data-add-projeval]", ()=>openProjectEvalModal(e));
  root.querySelectorAll("[data-del-projeval]").forEach(b=> b.onclick=async()=>{ if(await confirmDialog("평가 삭제","해당 프로젝트 평가를 삭제할까요?")){ await dbDelete("project_evaluations", b.dataset.delProjeval); refreshDrawerAfterMutate(e.id);} });

  // annual eval
  bindClick(root,"[data-add-annualeval]", ()=>openAnnualEvalModal(e));
  root.querySelectorAll("[data-del-annualeval]").forEach(b=> b.onclick=async()=>{ if(await confirmDialog("평가 삭제","해당 연간 평가를 삭제할까요?")){ await dbDelete("annual_evaluations", b.dataset.delAnnualeval); refreshDrawerAfterMutate(e.id);} });

  // regular eval (상시 평가, 무기명)
  bindClick(root,"[data-add-regulareval]", ()=>openRegularEvalModal(e));
  root.querySelectorAll("[data-del-regulareval]").forEach(b=> b.onclick=async()=>{ if(await confirmDialog("평가 삭제","해당 상시 평가를 삭제할까요?")){ await dbDelete("regular_evaluations", b.dataset.delRegulareval); refreshDrawerAfterMutate(e.id);} });

  // contracts
  bindClick(root,"[data-add-contract]", ()=>openContractModal(e));
  root.querySelectorAll("[data-del-contract]").forEach(b=> b.onclick=async()=>{ if(await confirmDialog("계약 삭제","해당 계약 기록을 삭제할까요?")){ await dbDelete("contracts", b.dataset.delContract); refreshDrawerAfterMutate(e.id);} });

  // probation
  const startBtn = root.querySelector("[data-start-probation]");
  if(startBtn) startBtn.onclick = async ()=>{
    const start = todayISO();
    await dbUpdate("employees", e.id, {status:"수습", probation:{startDate:start, endDate:addMonths(start,3), finalDecision:"대기", evaluations:[]}});
    toast("수습이 시작되었습니다. 재직상태가 \"수습\"으로 설정되었습니다.");
    refreshDrawerAfterMutate(e.id);
  };
  bindClick(root,"[data-add-probation-eval]", ()=>openProbationEvalModal(e));
  root.querySelectorAll("[data-del-probation-eval]").forEach(b=> b.onclick=async()=>{
    if(await confirmDialog("평가 삭제","이 평가 기록을 삭제할까요?")){
      const p = e.probation || {};
      const evaluations = [...(p.evaluations||[])]; evaluations.splice(Number(b.dataset.delProbationEval),1);
      await dbUpdate("employees", e.id, {probation:{...p, evaluations}});
      refreshDrawerAfterMutate(e.id);
    }
  });
  const saveProbationBtn = root.querySelector("[data-save-probation]");
  if(saveProbationBtn) saveProbationBtn.onclick = async ()=>{
    const finalDecision = byId("finalDecisionSel").value;
    const patch = {
      finalDecision,
      finalDecisionDate: byId("finalDecisionDate").value,
      finalComment: byId("finalComment").value.trim(),
    };
    const empPatch = { probation: {...e.probation, ...patch} };
    if(finalDecision==="합격" && e.status==="수습") empPatch.status = "근무";
    await dbUpdate("employees", e.id, empPatch);
    toast(finalDecision==="합격" ? "합격 처리되었습니다. 재직상태가 \"근무\"로 전환되었습니다." : "최종 판정이 저장되었습니다.");
    refreshDrawerAfterMutate(e.id);
  };

}
function bindClick(root, sel, fn){ const el = root.querySelector(sel); if(el) el.onclick = fn; }
function refreshDrawerAfterMutate(empId){
  // called after local (non-realtime) mutation to make sure the employee detail screen reflects state immediately
  if(!realDb){ renderRoute(); }
}

function openProbationEvalModal(e, opts){
  opts = opts || {};
  const fromProbationList = !!opts.fromProbationList;
  const standalone = !e;
  const empOptions = standalone ? contractedEmployees().filter(x=>x.status==="수습").map(emp=>`<option value="${esc(emp.id)}">${esc(emp.name)} · ${esc(emp.division||"사업부 미정")}</option>`).join("") : "";
  openModal("수습 평가 등록", `
    ${standalone ? `<div class="form-grid"><div class="field span2"><label>직원 *</label><select id="pv_employee"><option value="">직원 선택 (계약 관리 등록된 수습 인원만 표시)</option>${empOptions}</select></div></div>` : ""}
    ${probationEvalFieldsHtml("pv")}
  `, `<button class="btn" data-cancel>취소</button><button class="btn btn-primary" id="savePV">등록</button>`);
  byId("overlayRoot").querySelector("[data-cancel]").onclick = closeOverlay;
  byId("savePV").onclick = async ()=>{
    let emp = e;
    if(standalone){
      const empId = byId("pv_employee").value;
      if(!empId){ toast("직원을 선택해 주세요."); return; }
      emp = empById(empId);
      if(!emp){ toast("직원 정보를 찾을 수 없습니다."); return; }
    }
    const fields = readProbationEvalFields("pv");
    if(!fields.evaluator){ toast("평가자를 입력해 주세요."); return; }
    const p = emp.probation || {};
    const evaluations = [...(p.evaluations||[]), fields];
    if(fromProbationList){
      const finalDecision = fields.finalOpinion === "정규직 전환 권고" ? "합격" : "불합격";
      const patch = { probation:{...p, evaluations, finalDecision, finalDecisionDate: todayISO()} };
      if(finalDecision==="합격" && emp.status==="수습") patch.status = "근무";
      await dbUpdate("employees", emp.id, patch);
      closeOverlay();
      setRoute("probation");
      toast("평가가 저장되었습니다. \""+emp.name+"\"님이 "+finalDecision+" 처리되어 완료 목록으로 이동했습니다.");
      return;
    }
    await dbUpdate("employees", emp.id, {probation:{...p, evaluations}});
    closeOverlay();
    if(standalone){ setRoute("probation"); } else { openEmployeeDrawer(emp.id, "probation"); }
  };
}

function latestContractOf(empId){
  const cs = state.contracts.filter(c=>c.employeeId===empId && c.status!=="완료").sort((a,b)=>(b.startDate||"").localeCompare(a.startDate||""));
  return cs[0] || null;
}
function latestProbationEvalDate(emp){
  const evs = (emp.probation && emp.probation.evaluations) || [];
  if(!evs.length) return null;
  return [...evs].sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0].date || null;
}

let evalTab = "project";
const EVAL_TAB_LABEL = { project:"프로젝트 평가", probation:"수습 평가", annual:"연간 평가", regular:"상시 평가" };
function renderUpcomingAlertsPanel(opts){
  const showProbation = !opts || opts.showProbation!==false;
  const showContract = !opts || opts.showContract!==false;
  const probDue = state.employees
    .filter(e=> e.status==="수습" && e.probation && e.probation.endDate)
    .map(e=>({e, d:daysUntil(e.probation.endDate)}))
    .filter(x=> x.d!==null && x.d>=0 && x.d<=30)
    .sort((a,b)=>a.d-b.d);
  const contractDue = state.contracts
    .filter(c=> c.status!=="완료" && c.endDate)
    .map(c=>({c, d:daysUntil(c.endDate)}))
    .filter(x=> x.d!==null && x.d>=0 && x.d<=30)
    .sort((a,b)=>a.d-b.d);
  const probPanel = `
      <div class="panel">
        <div class="panel-head"><h3>수습 평가 임박 (30일 이내)</h3><span class="cell-muted" style="font-size:12px;">${probDue.length}명</span></div>
        ${probDue.length ? `<div class="table-scroll panel-scroll-v"><table><tbody>
          ${probDue.map(({e,d})=>`
            <tr class="clickable" data-open-emp="${e.id}" data-open-tab="probation"><td><div class="name-cell"><div class="avatar">${esc(initials(e.name))}</div><div><div class="cell-strong">${esc(e.name)}</div><div class="meta">${esc(e.division||"—")}</div></div></div></td><td class="cell-muted">종료일 ${fmtDate(e.probation.endDate)}</td><td>${pill(ddayLabel(e.probation.endDate), d<=7?"danger":"warning")}</td></tr>
          `).join("")}
        </tbody></table></div>` : emptyState("clock","30일 이내 수습 종료 예정 인원이 없습니다")}
      </div>`;
  const contractPanel = `
      <div class="panel">
        <div class="panel-head"><h3>계약 만료 임박 (30일 이내)</h3><span class="cell-muted" style="font-size:12px;">${contractDue.length}건</span></div>
        ${contractDue.length ? `<div class="table-scroll panel-scroll-v"><table><tbody>
          ${contractDue.map(({c,d})=>`
            <tr class="clickable" data-open-emp="${c.employeeId}" data-open-tab="contracts"><td><div class="cell-strong">${esc(c.employeeName)}</div><div class="meta cell-muted">${esc(c.contractType||"—")}</div></td><td class="cell-muted">종료일 ${fmtDate(c.endDate)}</td><td>${pill(ddayLabel(c.endDate), d<=7?"danger":"warning")}</td></tr>
          `).join("")}
        </tbody></table></div>` : emptyState("doc","30일 이내 계약 만료 예정 건이 없습니다")}
      </div>`;
  if(showProbation && showContract){
    return `<div class="grid" style="grid-template-columns:1fr 1fr; margin-bottom:16px;">${probPanel}${contractPanel}</div>`;
  }
  return `<div class="grid" style="grid-template-columns:1fr; margin-bottom:16px;">${showProbation?probPanel:""}${showContract?contractPanel:""}</div>`;
}

function openRegisterLeaveModal(){

      </div>

    toast("지원금 항목이 등록되었습니다.");
    setRoute("subsidyPrograms");

}

/* =========================================================

function renderSubsidyRows(list, empOnlyList){
  const appRows = list.map(a=>{
      const sumReceived = (a.months||[]).filter(m=>m.submitted).reduce((s,m)=>s+(Number(m.amount)||0),0);
      const pct = a.totalAmount ? Math.min(100, Math.round(sumReceived/a.totalAmount*100)) : 0;
      const st = a.status||"대기";
      return `
      <tr><td class="cell-strong">${esc(a.employeeName)}${a.isSample?'<span class="tag-sample">샘플</span>':""}</td><td class="cell-muted">${esc(a.program||"—")}</td><td class="cell-muted">${fmtDate(a.periodStart)} ~ ${fmtDate(a.periodEnd)}</td><td class="num">${fmtWon(a.totalAmount)}</td><td class="num">${fmtWon(sumReceived)}</td><td class="num">${pct}%</td><td>${pill(st, subsidyStatusTone(st))}</td><td style="white-space:nowrap;"><button class="btn btn-sm" data-open-subsidy="${a.id}">상세 보기</button><button class="icon-btn" data-del-app="${a.id}">${ICON.trash}</button></td></tr>
      `;
    }).join("");
  // 인력 마스터에서 지원금 대상자 상태만 지정되고 아직 신청 건이 등록되지 않은 직원 -- 목록에는
  // 노출하되(사용자 요청: 대상자 상태에 따라 대기/진행/완료 리스트에 표시), 신청 데이터가 없으므로
  // 항목·기간·금액 칸은 빈 값으로 두고 "신청 등록" 버튼으로 실제 신청 건 등록을 유도한다.
  const empRows = (empOnlyList||[]).map(e=>{
      return `<tr><td class="cell-strong">${esc(e.name)}${e.isSample?'<span class="tag-sample">샘플</span>':""}</td><td class="cell-muted">—</td><td class="cell-muted">—</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td>${pill(e.subsidyEligible, subsidyEmpStatusTone(e.subsidyEligible))}</td><td style="white-space:nowrap;"><button class="btn btn-sm" data-open-subsidy-emp="${e.id}">신청 등록</button></td></tr>`;
    }).join("");
  return `<div class="table-scroll"><table>
    <thead><tr><th>직원</th><th>지원 항목</th><th>기간</th><th>총 신청액</th><th>수령액</th><th>진행률</th><th>상태</th><th></th></tr></thead>
    <tbody>${appRows}${empRows}</tbody></table></div>`;
}
// Shared by renderSubsidyView() (대기/진행/완료 리스트 + KPI 카드) and navCountFor("subsidyTargets")
// (사이드바 "지원금 관리" 메뉴 숫자 = 대기 대상 인원 + 진행 대상 인원) so both always agree on the
// same target-employee counts, including employees who only have a 인력마스터 상태 지정(신청 미등록).
function subsidySectionData(){
  const all = [...state.subsidyApps];
  const appEmpIds = new Set(all.map(a=>a.employeeId));
  const pending = all.filter(a=> (a.status||"대기")==="대기").sort((a,b)=> (b.periodStart||"").localeCompare(a.periodStart||""));
  const inProgress = all.filter(a=> a.status==="진행").sort((a,b)=> (b.periodStart||"").localeCompare(a.periodStart||""));
  const completed = all.filter(a=> a.status==="완료").sort((a,b)=> (b.periodEnd||b.periodStart||"").localeCompare(a.periodEnd||a.periodStart||""));
  // 인력 마스터 지원금 대상자 상태는 지정되어 있지만 아직 신청 건이 없는 직원 -- 상태별로 나눠
  // 각 리스트에 함께 노출한다(신청 건이 이미 있는 직원은 위 app 목록에 이미 반영되어 중복 노출하지 않음).
  const pendingEmpOnly = state.employees.filter(e=> e.subsidyEligible==="대기" && !appEmpIds.has(e.id));
  const inProgressEmpOnly = state.employees.filter(e=> e.subsidyEligible==="진행중" && !appEmpIds.has(e.id));
  const completedEmpOnly = state.employees.filter(e=> e.subsidyEligible==="완료" && !appEmpIds.has(e.id));
  const pendingTargetCount = new Set(pending.map(a=>a.employeeId)).size + pendingEmpOnly.length;
  const inProgressTargetCount = new Set(inProgress.map(a=>a.employeeId)).size + inProgressEmpOnly.length;
  return { pending, inProgress, completed, pendingEmpOnly, inProgressEmpOnly, completedEmpOnly, pendingTargetCount, inProgressTargetCount };
}
function renderSubsidyView(){
  const { pending, inProgress, completed, pendingEmpOnly, inProgressEmpOnly, completedEmpOnly, pendingTargetCount, inProgressTargetCount } = subsidySectionData();

  return `
    <div class="topbar">
      <div><h1>지원금 관리</h1><div class="desc">신청 대상자와 항목·기간·전체 금액을 등록하고 월별 지급 현황을 관리합니다</div></div>
      <div class="topbar-actions"><button class="btn btn-primary" id="btnAddSubsidyApp">${ICON.plus}신청 등록</button></div>
    </div>
    <div class="grid kpi-grid">
      ${kpiCard("coin","대기 대상 인원", pendingTargetCount+"명", "대기 리스트 대상 인원", "warning")}
      ${kpiCard("coin","진행 대상 인원", inProgressTargetCount+"명", "진행 리스트 대상 인원", "info")}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>대기 리스트</h3><span class="cell-muted" style="font-size:12px;">${pending.length+pendingEmpOnly.length}건</span></div>
      ${(pending.length||pendingEmpOnly.length) ? renderSubsidyRows(pending, pendingEmpOnly) : emptyState("coin","대기 중인 정부지원금 신청이 없습니다")}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>진행 리스트</h3><span class="cell-muted" style="font-size:12px;">${inProgress.length+inProgressEmpOnly.length}건</span></div>
      ${(inProgress.length||inProgressEmpOnly.length) ? renderSubsidyRows(inProgress, inProgressEmpOnly) : emptyState("coin","진행 중인 정부지원금 신청이 없습니다")}
    </div>
    <div class="panel">
      <div class="panel-head"><h3>완료 리스트</h3><span class="cell-muted" style="font-size:12px;">${completed.length+completedEmpOnly.length}건</span></div>
      ${(completed.length||completedEmpOnly.length) ? renderSubsidyRows(completed, completedEmpOnly) : emptyState("coin","완료된 정부지원금 신청이 없습니다")}
    </div>
  `;
}

function openSubsidyAppModal(existing, presetEmployee, returnTo){
  returnTo = returnTo || "subsidy";
  const fixedEmp = existing ? empById(existing.employeeId) : presetEmployee;
  const eligibleEmployees = state.employees.filter(e=> e.subsidyEligible && e.subsidyEligible!=="아니오");
  const empList = (fixedEmp && !eligibleEmployees.some(e=>e.id===fixedEmp.id)) ? [...eligibleEmployees, fixedEmp] : eligibleEmployees;
  const empOptions = empList.map(e=>`<option value="${esc(e.id)}" ${fixedEmp&&fixedEmp.id===e.id?"selected":""}>${esc(e.name)} · ${esc(e.division||"사업부 미정")}</option>`).join("");
  const programOptions = state.subsidyPrograms.map(p=>`<option value="${esc(p.id)}" ${existing&&existing.programId===p.id?"selected":""}>${esc(p.name)}</option>`).join("");
  if(!state.subsidyPrograms.length){ toast("먼저 설정 > 지원금 마스터에서 지원금 항목을 등록해 주세요."); return; }
  if(!fixedEmp && !eligibleEmployees.length){ toast("인력 마스터에서 지원금 대상자가 지정된 직원이 없습니다. 먼저 인력 마스터에서 대상 직원의 지원금 대상자를 \"대기\" 등으로 지정해 주세요."); return; }
  openModal(existing?"신청 정보 수정":"정부지원금 신청 등록", `
    <div class="form-grid">
      <div class="field span2"><label>대상 직원 *</label><select id="sa_emp" ${fixedEmp?"disabled":""}>${fixedEmp?"":'<option value="">직원 선택</option>'}${empOptions}</select><div class="hint">인력 마스터에서 지원금 대상자가 "아니오"가 아닌 직원만 표시됩니다.</div></div>
      <div class="field span2"><label>지원금 항목 *</label><select id="sa_program"><option value="">항목 선택 (설정 &gt; 지원금 마스터에 등록된 항목)</option>${programOptions}</select></div>
      <div class="field"><label>진행 상태</label><select id="sa_status">${SUBSIDY_STATUS_OPTIONS.map(s=>`<option ${(existing?existing.status:"대기")===s?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field"><label>지급 방식</label><select id="sa_paymentType">
        <option value="월별" ${(!existing||existing.paymentType!=="1회성")?"selected":""}>월별</option>
        <option value="1회성" ${existing&&existing.paymentType==="1회성"?"selected":""}>1회성</option>
      </select></div>
      <div class="field"><label>지원 기간 시작</label><input type="date" id="sa_start" value="${esc((existing&&existing.periodStart)||"")}"></div>
      <div class="field"><label>지원 기간 종료</label><input type="date" id="sa_end" value="${esc((existing&&existing.periodEnd)||"")}"></div>
      <div class="field" id="sa_months_wrap"><label>개월 수</label><input type="number" min="1" id="sa_months" value="${esc((existing&&existing.monthsCount)||"")}"></div>
      <div class="field"><label>월별 신청금액(만원)</label><input type="number" id="sa_monthly" value="${esc((existing&&existing.monthlyAmount)??"")}"></div>
      <div class="field span2"><label>전체 신청 금액(만원)</label><input type="number" id="sa_total" value="${esc((existing&&existing.totalAmount)??"")}"></div>
      <div class="field span2"><label>비고</label><textarea id="sa_notes" rows="2">${esc((existing&&existing.notes)||"")}</textarea></div>
    </div>
    <div class="field hint" style="margin-top:8px;">직원과 지원금 항목의 조합으로 신청 건이 식별됩니다 (동일 조합 중복 등록 불가). "월별"을 선택하면 개월 수·월별 신청금액을 입력할 수 있고, 기간을 입력하면 오른쪽 화면에 월별 청구 항목이 자동으로 생성됩니다. "1회성"을 선택하면 전체 신청 금액을 한 번에 청구하는 건으로 등록됩니다.</div>
  `, `<button class="btn" data-cancel>취소</button><button class="btn btn-primary" id="saveSubsidyApp">${existing?"저장":"등록"}</button>`);
  byId("overlayRoot").querySelector("[data-cancel]").onclick = closeOverlay;
  const programSel = byId("sa_program");
  programSel.addEventListener("change", ()=>{
    const match = state.subsidyPrograms.find(p=>p.id===programSel.value);
    if(!match) return;
    const totalEl = byId("sa_total");
    if(totalEl && !totalEl.value && match.amount) totalEl.value = match.amount;
    const startEl = byId("sa_start"), endEl = byId("sa_end");
    if(startEl && startEl.value && endEl && !endEl.value && match.months) endEl.value = addMonths(startEl.value, match.months);
    const monthsEl = byId("sa_months");
    if(monthsEl && !monthsEl.value && match.months) monthsEl.value = match.months;
  });
  const paymentTypeSel = byId("sa_paymentType");
  const monthsWrap = byId("sa_months_wrap");
  function syncPaymentTypeUI(){ monthsWrap.style.display = paymentTypeSel.value==="월별" ? "" : "none"; }
  paymentTypeSel.addEventListener("change", syncPaymentTypeUI);
  syncPaymentTypeUI();
  const monthsEl = byId("sa_months");
  monthsEl.addEventListener("change", ()=>{
    const startEl = byId("sa_start"), endEl = byId("sa_end");
    const n = Number(monthsEl.value)||0;
    if(paymentTypeSel.value==="월별" && n>0 && startEl.value) endEl.value = addMonths(startEl.value, n);
  });
  byId("saveSubsidyApp").onclick = async ()=>{
    const empId = fixedEmp ? fixedEmp.id : byId("sa_emp").value;
    const emp = empById(empId);
    if(!emp){ toast("대상 직원을 선택해 주세요."); return; }
    const programId = programSel.value;
    const programObj = state.subsidyPrograms.find(p=>p.id===programId);
    if(!programObj){ toast("지원금 항목을 선택해 주세요."); return; }
    if(!existing && state.subsidyApps.some(a=> a.employeeId===emp.id && a.programId===programId)){
      toast("이미 해당 직원·항목 조합으로 등록된 신청 건이 있습니다. 왼쪽 목록에서 선택해 수정해 주세요.");
      return;
    }
    const program = programObj.name;
    const status = byId("sa_status").value;
    const paymentType = byId("sa_paymentType").value;
    const periodStart = byId("sa_start").value;
    let periodEnd = byId("sa_end").value;
    const monthsCount = Number(byId("sa_months").value)||0;
    const monthlyAmount = Number(byId("sa_monthly").value)||0;
    let totalAmount = Number(byId("sa_total").value)||0;
    const notes = byId("sa_notes").value.trim();
    if(paymentType==="월별" && monthsCount>0 && periodStart && !periodEnd){
      periodEnd = addMonths(periodStart, monthsCount);
    }
    if(!totalAmount && paymentType==="월별" && monthlyAmount && monthsCount){
      totalAmount = monthlyAmount*monthsCount;
    }
    let months;
    if(paymentType==="1회성"){
      months = periodStart ? [{ym:periodStart.slice(0,7), item:program, submitted:false, amount: totalAmount||monthlyAmount}] : [];
    } else {
      const ymList = monthsBetween(periodStart, periodEnd);
      const perMonthDefault = monthlyAmount || (ymList.length ? Math.round(totalAmount/ymList.length) : 0);
      if(existing){
        const oldByYm = {}; (existing.months||[]).forEach(m=> oldByYm[m.ym]=m);
        months = ymList.map(ym=> oldByYm[ym] ? oldByYm[ym] : {ym, item:program, submitted:false, amount:perMonthDefault});
      } else {
        months = ymList.map(ym=>({ym, item:program, submitted:false, amount:perMonthDefault}));
      }
    }
    const payload = {employeeId:emp.id, employeeName:emp.name, programId, program, status, paymentType, monthsCount:monthsCount||months.length, monthlyAmount, periodStart, periodEnd, totalAmount, notes, months};
    if(existing){
      await dbUpdate("subsidy_applications", existing.id, payload);
      await syncEmployeeSubsidyStatus(emp.id, existing.id, status);
    } else {
      const newId = await dbAdd("subsidy_applications", payload);
      await syncEmployeeSubsidyStatus(emp.id, newId, status);
    }
    closeOverlay();
    toast(existing ? "신청 정보가 저장되었습니다." : "정부지원금 신청이 등록되었습니다.");
    setRoute("subsidy");
  };
}

    const emp = empById(b.dataset.probationView);
